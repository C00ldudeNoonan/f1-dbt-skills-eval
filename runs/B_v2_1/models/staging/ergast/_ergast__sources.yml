      - name: races
        description: "Race calendar, including scheduled races with no results yet."
        data_tests:
          - no_conflicting_duplicates:
              arguments:
                key_columns: [raceid]
                compare_columns: [year, round, circuitid, name, date, time, url, fp1_date, fp1_time, fp2_date, fp2_time, fp3_date, fp3_time, quali_date, quali_time, sprint_date, sprint_time]
          - no_redelivered_rows:
              arguments:
                key_columns: [raceid]
              config:
                severity: warn
        columns:
          - name: raceid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: year
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: round
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: circuitid
            data_type: text
