# Every column the vendor sends is declared here. Two layers catch vendor changes:
#   1. on-run-start macro check_source_schemas fails the run before anything builds
#      if a declared table or column is missing (and warns on new, undeclared columns).
#   2. matches_pattern tests fail if a parsed column's values change format.
#   3. no_conflicting_duplicates fails if a natural key arrives twice with different
#      values; no_redelivered_rows warns on identical re-deliveries (staging dedupes them).
# When the vendor changes something, update this file, the staging model, and
# the 'Vendor changes' log in README.md.
sources:
  - name: ergast
    description: >
      Ergast / Kaggle Formula 1 dataset (1950 to the current season). Every
      column is TEXT; nulls are the literal string `\N` (or empty strings in
      some columns). Read-only: never write to this schema.
    database: ANALYTICS_DEV
    schema: F1_RAW_B_v2_1
    quoting:
      schema: false
      identifier: false
    tables:
      - name: circuits
        description: "Circuits."
        data_tests:
          - no_conflicting_duplicates:
              arguments:
                key_columns: [circuitid]
                compare_columns: [circuitref, name, location, country, lat, lng, alt, url]
          - no_redelivered_rows:
              arguments:
                key_columns: [circuitid]
              config:
                severity: warn
        columns:
          - name: circuitid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: circuitref
            data_type: text
          - name: name
            data_type: text
          - name: location
            data_type: text
          - name: country
            data_type: text
          - name: lat
            data_type: text
            data_tests:
              - matches_pattern: {arguments: {pattern: '^-?[0-9]+([.][0-9]+)?$'}}
          - name: lng
            data_type: text
            data_tests:
              - matches_pattern: {arguments: {pattern: '^-?[0-9]+([.][0-9]+)?$'}}
          - name: alt
            data_type: text
            data_tests:
              - matches_pattern: {arguments: {pattern: '^-?[0-9]+([.][0-9]+)?$'}}
          - name: url
            data_type: text
      - name: constructors
        description: "Constructors (teams)."
        data_tests:
          - no_conflicting_duplicates:
              arguments:
                key_columns: [constructorid]
                compare_columns: [constructorref, name, nationality, url]
          - no_redelivered_rows:
              arguments:
                key_columns: [constructorid]
              config:
                severity: warn
        columns:
          - name: constructorid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: constructorref
            data_type: text
          - name: name
            data_type: text
          - name: nationality
            data_type: text
          - name: url
            data_type: text
      - name: constructor_results
        description: "Constructor points per race."
        data_tests:
          - no_conflicting_duplicates:
              arguments:
                key_columns: [raceid, constructorid]
                compare_columns: [points, status]
          - no_redelivered_rows:
              arguments:
                key_columns: [raceid, constructorid]
              config:
                severity: warn
        columns:
          - name: constructorresultsid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: raceid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: constructorid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: points
            data_type: text
            data_tests:
              - matches_pattern: {arguments: {pattern: '^[0-9]+([.][0-9]+)?$'}}
          - name: status
            data_type: text
      - name: constructor_standings
        description: "Cumulative constructor standings after each race."
        data_tests:
          - no_conflicting_duplicates:
              arguments:
                key_columns: [raceid, constructorid]
                compare_columns: [points, position, positiontext, wins]
          - no_redelivered_rows:
              arguments:
                key_columns: [raceid, constructorid]
