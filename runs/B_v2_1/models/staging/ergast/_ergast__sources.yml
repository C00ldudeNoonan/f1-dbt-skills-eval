          - name: nationality
            data_type: text
          - name: url
            data_type: text
      - name: driver_standings
        description: "Cumulative championship standings after each race (includes sprint points from 2021)."
        data_tests:
          - no_conflicting_duplicates:
              arguments:
                key_columns: [raceid, driverid]
                compare_columns: [points, position, positiontext, wins]
          - no_redelivered_rows:
              arguments:
                key_columns: [raceid, driverid]
              config:
                severity: warn
        columns:
          - name: driverstandingsid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: raceid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: driverid
