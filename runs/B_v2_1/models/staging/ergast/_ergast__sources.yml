        columns:
          - name: constructorstandingsid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: raceid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: constructorid
            data_type: text
            data_tests:
              - not_null
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: points
            data_type: text
            data_tests:
              - matches_pattern: {arguments: {pattern: '^[0-9]+([.][0-9]+)?$'}}
          - name: position
            data_type: text
            data_tests:
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
          - name: positiontext
            data_type: text
            data_tests:
              - matches_pattern: {arguments: {pattern: '^([0-9]+|[RDEWFN])$'}}
          - name: wins
            data_type: text
            data_tests:
              - matches_pattern: {arguments: {pattern: '^[0-9]+$'}}
      - name: drivers
        description: "Drivers, current values only (history is in snp_drivers)."
        data_tests:
          - no_conflicting_duplicates:
              arguments:
                key_columns: [driverid]
                compare_columns: [driverref, number, code, forename, surname, dob, nationality, url]
