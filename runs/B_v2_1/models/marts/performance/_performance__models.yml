models:
  - name: mart_constructor_season_pit_stops
    description: >
      One row per constructor per season with pit stop data (2011 onward).
      Stops over 60 seconds are red-flag stoppages and are excluded. Stop
      time is total pit-lane time, as recorded by Ergast, not stationary time.
    config:
      contract: {enforced: true}
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, constructor_id]
    columns:
      - name: season
        data_type: integer
        data_tests: [not_null]
      - name: constructor_id
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_constructors'), field: constructor_id}
      - name: pit_stop_count
        data_type: integer
        description: Pit stops of 60 seconds or less.
      - name: median_pit_stop_seconds
        data_type: number(10, 3)
        description: Median duration of those stops, in seconds.

  - name: mart_teammate_head_to_head
    description: >
      One row per season, constructor, driver and teammate (both orderings),
      for drivers who both had a Grand Prix result for the same constructor in
      the same race at least once that season.
    config:
      contract: {enforced: true}
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, constructor_id, driver_id, teammate_id]
    columns:
      - name: season
        data_type: integer
        data_tests: [not_null]
      - name: constructor_id
        data_type: integer
        data_tests: [not_null]
      - name: driver_id
        data_type: integer
        data_tests: [not_null]
      - name: teammate_id
        data_type: integer
        data_tests: [not_null]
      - name: races_together
        data_type: integer
        description: Distinct Grands Prix where both drivers had a result for this constructor.
      - name: races_ahead
        data_type: integer
        description: Of races_together, races where the driver's best position_order beat the teammate's best.
      - name: qualifying_together
        data_type: integer
        description: Distinct races where both drivers have a qualifying entry for this constructor.
      - name: qualifying_ahead
        data_type: integer
        description: Of qualifying_together, races where the driver qualified ahead of the teammate.
