unit_tests:
  - name: stints_split_on_pit_laps_and_drop_empty_stints
    description: >
      Driver 1 pits twice on lap 3 and again on lap 7. Driver 2 never pits.
      Driver 3 pits on its last lap. Driver 4's stop is logged after its last
      lap, so that trailing stint has no laps and is dropped.
    model: fct_stints
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('fct_lap_times')
        format: sql
        rows: |
          select 1 as race_id, 2024 as season, 1 as round, d.driver_id, l.lap, 1 as position,
                 iff(l.lap = 1, 130, 100) as lap_time_ms, '2024-01-01'::timestamp_ntz as loaded_at
          from (select 1 as driver_id, 10 as max_lap union all select 2, 5 union all select 3, 4 union all select 4, 3) as d
          inner join (select seq4() + 1 as lap from table(generator(rowcount => 10))) as l
              on l.lap <= d.max_lap
      - input: ref('stg_ergast__pit_stops')
        rows:
          - {race_id: 1, driver_id: 1, stop_number: 1, lap: 3, duration_ms: 22000}
          - {race_id: 1, driver_id: 1, stop_number: 2, lap: 3, duration_ms: 22000}
          - {race_id: 1, driver_id: 1, stop_number: 3, lap: 7, duration_ms: 22000}
          - {race_id: 1, driver_id: 3, stop_number: 1, lap: 4, duration_ms: 22000}
          - {race_id: 1, driver_id: 4, stop_number: 1, lap: 6, duration_ms: 22000}
    expect:
      rows:
        - {driver_id: 1, stint_number: 1, start_lap: 1, end_lap: 3, stint_laps: 3, avg_lap_time_ms: 110}
        - {driver_id: 1, stint_number: 2, start_lap: 4, end_lap: 7, stint_laps: 4, avg_lap_time_ms: 100}
        - {driver_id: 1, stint_number: 3, start_lap: 8, end_lap: 10, stint_laps: 3, avg_lap_time_ms: 100}
        - {driver_id: 2, stint_number: 1, start_lap: 1, end_lap: 5, stint_laps: 5, avg_lap_time_ms: 106}
        - {driver_id: 3, stint_number: 1, start_lap: 1, end_lap: 4, stint_laps: 4, avg_lap_time_ms: 107.5}
        - {driver_id: 4, stint_number: 1, start_lap: 1, end_lap: 3, stint_laps: 3, avg_lap_time_ms: 110}
