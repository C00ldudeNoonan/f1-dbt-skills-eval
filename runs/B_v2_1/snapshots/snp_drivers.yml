snapshots:
  - name: snp_drivers
    description: >
      Type 2 history of the drivers table. Raw `drivers` only holds current
      values (car number, code, name, nationality), so every build compares the
      current row to the last snapshot and closes/opens a version when anything
      changed. History starts from the first snapshot run; earlier changes are
      not recoverable from the source. Never full-refresh or drop this table.
    relation: ref('stg_ergast__drivers')
    config:
      schema: snapshots
      unique_key: driver_id
      strategy: check
      check_cols: all
      hard_deletes: invalidate
    columns:
      - name: driver_id
        data_tests: [not_null]
      - name: dbt_scd_id
        data_tests: [unique]
