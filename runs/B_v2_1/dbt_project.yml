name: f1_analytics
version: "1.0.0"
profile: f1

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]
target-path: target
# Stop the run before anything builds if the vendor renamed or dropped a
# declared source table or column (see macros/check_source_schemas.sql).
on-run-start:
  - "{{ check_source_schemas() }}"

clean-targets: ["target", "dbt_packages", "logs"]

# Base schema comes from profiles.yml (F1_DBT_B_v2_1); layers get suffixes,
# e.g. F1_DBT_B_v2_1_staging. Nothing here ever writes to the raw schema.
models:
  f1_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # Everything is protected (usable only inside this project) unless a
      # model's YAML explicitly makes it public. Public models: fct_results,
      # dim_drivers (group f1_core).
      +access: protected
    semantic:
      +schema: marts
      +materialized: table
    audit:
      +schema: audit
      +materialized: view

vars:
  # Pit stops longer than this are treated as red-flag stoppages, not service stops.
  max_pit_stop_ms: 60000
  # A lap slower than this multiple of the race's fastest lap is not a green-flag lap.
  green_lap_max_ratio: 1.3
  # The timing provider may reissue corrected lap times for this many of the most
  # recent races already loaded. Incremental lap models reprocess them every run.
  lap_correction_window_races: 2
  # Points system (from seeds/points_systems.csv) used by mart_alt_points_standings.
  alt_points_system: fia_2010
  # Countback compares counts of 1st, 2nd, ... down to this place.
  alt_points_countback_depth: 10
  # Telemetry incremental loads re-read raw rows loaded up to this many hours
  # before the newest one already processed (covers out-of-order commits).
  telemetry_lookback_hours: 6
  # Heavy tests on the telemetry tables only check rows ingested in the last
  # N days (set to a large value for a full audit).
  telemetry_test_window_days: 3
  # First season used to rank drivers against teammates (full qualifying-time
  # coverage begins in 2006).
  overperformance_min_season: 2006
