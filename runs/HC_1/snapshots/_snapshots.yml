version: 2

snapshots:
  - name: snp_drivers
    description: >
      Type 2 history of driver attributes (car number, code, name, date of birth, nationality)
      from the raw DRIVERS table. Each change creates a new row with dbt_valid_from and
      dbt_valid_to. Only changes seen after the first snapshot run are recorded: the raw table
      holds current values only, so earlier history is not available.
    columns:
      - name: driverid
        description: Ergast driver identifier. Unique per version row, not per driver.
        data_tests:
          - not_null
      - name: dbt_valid_from
        description: When this version became current.
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: When this version was superseded. Null for the current version.
