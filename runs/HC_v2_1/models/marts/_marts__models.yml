version: 2

models:
  - name: fct_results
    description: >
      One row per Grand Prix result entry, 1950 to 2024. Sprints are excluded. finish_position is
      the classified place (null when not classified). is_win and is_podium use finish_position,
      so they are false for non-finishers. Points include half points and, from 2021, do not
      include sprint points (see SPRINT_RESULTS for those).
    semantic_model:
      enabled: true
    agg_time_dimension: race_date
    config:
      access: public
      group: f1_core
      contract:
        enforced: true
    columns:
      - name: result_id
        entity:
          type: primary
          name: result
        data_type: integer
        description: Primary key. One row per source result entry.
        data_tests:
          - unique
          - not_null
      - name: race_id
        data_type: integer
        description: Grand Prix the result belongs to.
        data_tests:
          - not_null
      - name: season
        dimension:
          type: categorical
        data_type: integer
        description: Championship year, from the race calendar.
        data_tests:
          - not_null
      - name: round
        data_type: integer
        description: Round within the season.
        data_tests:
          - not_null
      - name: race_date
        granularity: day
        dimension:
          type: time
        data_type: date
        description: Scheduled race date.
      - name: driver_id
        entity:
          type: foreign
          name: driver
        data_type: integer
        description: Driver on this result.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drivers')
                field: driver_id
      - name: constructor_id
        data_type: integer
        description: Constructor (team) of the car, which can differ from the driver's other entries in the same race.
        data_tests:
          - not_null
      - name: constructor_name
        dimension:
          type: categorical
        data_type: varchar
        description: Human-readable constructor name at the time of the race.
      - name: grid
        data_type: integer
        description: Starting grid slot. 0 means the driver started from the pit lane.
      - name: finish_position
        data_type: integer
        description: >
          Classified finishing position. Null when the driver did not finish or was not classified.
          Taken from POSITION, or from POSITIONTEXT when POSITION is null but the text is numeric
          (lapped finishers in 2005 Australia).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 60
              config:
                where: "finish_position is not null"
      - name: position_order
        data_type: integer
        description: Finishing order including non-finishers. Use for head-to-head comparisons.
        data_tests:
          - not_null
      - name: points
        data_type: number(6,2)
        description: >
          Championship points for this result. The 2014 Abu Dhabi finale awarded double points
          (up to 50 for a win), so the upper bound is 50 rather than 25.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50
      - name: laps
        data_type: integer
        description: Laps completed.
      - name: status
        data_type: varchar
        description: Finishing status text (for example Finished, +1 Lap, Engine).
      - name: is_win
        data_type: boolean
        description: True when finish_position is 1.
        data_tests:
          - not_null
      - name: is_podium
        data_type: boolean
        description: True when finish_position is 1, 2 or 3.
        data_tests:
          - not_null
      - name: fastest_lap_time_ms
        data_type: integer
        description: Driver's fastest lap in milliseconds. Null before 2004, when the source did not record it.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_win or finish_position = 1"
          config:
            severity: error
    metrics:
      - name: race_starts
        type: simple
        label: Race starts
        description: Grand Prix result entries.
        agg: count
        expr: result_id
      - name: wins
        type: simple
        label: Wins
        description: Grand Prix race wins.
        agg: sum_boolean
        expr: is_win
      - name: podiums
        type: simple
        label: Podiums
        description: Grand Prix podium finishes.
        agg: sum_boolean
        expr: is_podium
      - name: championship_points
        type: simple
        label: Championship points
        description: Sum of Grand Prix championship points.
        agg: sum
        expr: points
      - name: podium_rate
        type: ratio
        label: Podium rate
        description: Podiums divided by race starts.
        numerator: podiums
        denominator: race_starts
      - name: points_per_start
        type: ratio
        label: Points per start
        description: Championship points divided by race starts.
        numerator: championship_points
        denominator: race_starts

  - name: dim_drivers
    description: >
      One row per driver, including drivers who never raced (career figures are zero). Includes a placeholder row
      for any driver ID that appears in results before its driver record arrives. A world championship counts only
      for complete seasons, so a season that still has calendar races without results never adds one.
      Versioned: version 2 is the latest and splits full_name into first_name and last_name. Version 1 is
      deprecated on 2027-01-01.
    latest_version: 2
    semantic_model:
      enabled: true
    config:
      access: public
      group: f1_core
      contract:
        enforced: true
    versions:
      - v: 1
        deprecation_date: 2027-01-01
        columns:
          - name: driver_id
            data_type: integer
            entity:
              type: primary
              name: driver
            description: Primary key.
          - name: driver_ref
            data_type: varchar
            description: Stable text reference used in other systems (for example hamilton).
          - name: current_number
            data_type: integer
            description: Permanent car number, null for drivers without one (none before 2014 and placeholders).
          - name: full_name
            data_type: varchar
            description: Forename and surname joined with a space. Replaced by first_name and last_name in version 2.
          - name: nationality
            data_type: varchar
            dimension:
              type: categorical
          - name: date_of_birth
            data_type: date
          - name: career_starts
            data_type: integer
            description: Distinct Grands Prix with a result for this driver. Two cars in one event count once.
          - name: career_wins
            data_type: integer
            description: Grand Prix race wins (finish_position 1).
          - name: career_podiums
            data_type: integer
            description: Grand Prix podium finishes (finish_position 1 to 3).
          - name: career_sprint_wins
            data_type: integer
            description: Sprint wins (finish_position 1 in a sprint).
          - name: world_championships
            data_type: integer
            description: Seasons finished first in a complete season.
          - name: is_placeholder
            data_type: boolean
            description: >
              True for an ID that appears in results or qualifying before its driver record arrives. The placeholder is
              replaced by the real record on the next run, with no manual step.
      - v: 2
        columns:
          - name: driver_id
            data_type: integer
            entity:
              type: primary
              name: driver
            description: Primary key.
          - name: driver_ref
            data_type: varchar
            description: Stable text reference used in other systems (for example hamilton).
          - name: current_number
            data_type: integer
            description: Permanent car number, null for drivers without one (none before 2014 and placeholders).
          - name: first_name
            data_type: varchar
            description: Forename. Placeholder rows have first_name 'Unknown'.
          - name: last_name
            data_type: varchar
            description: Surname. Placeholder rows have last_name 'Driver <id>'.
          - name: nationality
            data_type: varchar
            dimension:
              type: categorical
          - name: date_of_birth
            data_type: date
          - name: career_starts
            data_type: integer
            description: Distinct Grands Prix with a result for this driver. Two cars in one event count once.
          - name: career_wins
            data_type: integer
            description: Grand Prix race wins (finish_position 1).
          - name: career_podiums
            data_type: integer
            description: Grand Prix podium finishes (finish_position 1 to 3).
          - name: career_sprint_wins
            data_type: integer
            description: Sprint wins (finish_position 1 in a sprint).
          - name: world_championships
            data_type: integer
            description: Seasons finished first in a complete season.
          - name: is_placeholder
            data_type: boolean
            description: >
              True for an ID that appears in results or qualifying before its driver record arrives. The placeholder is
              replaced by the real record on the next run, with no manual step.
  - name: mart_driver_season_standings
    description: >
      One row per driver per season, as of the last round with standings data (the latest completed round).
      The champion and their final points match the official record for every season from 1950 to 2023
      (a singular test checks this against the official_season_champions seed). is_season_complete is false for 2024.
    columns:
      - name: season
        description: Championship year.
        data_tests:
          - not_null
      - name: driver_id
        description: Driver in the standings.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drivers')
                field: driver_id
      - name: championship_position
        description: >
          Driver's championship position at as_of_round. Ties share a position. Null when the
          official table leaves the driver unranked (1997 Schumacher, excluded with a D code).
      - name: points
        description: Championship points at as_of_round, including sprint points from 2021 and the drop-score rules before 1991.
        data_tests:
          - not_null
      - name: wins
        description: Race wins in the season so far at as_of_round.
        data_tests:
          - not_null
      - name: as_of_round
        description: The last round in the season that has standings data.
        data_tests:
          - not_null
      - name: is_season_complete
        description: False while the season still has calendar races with no results loaded.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - driver_id

  - name: mart_constructor_season_pit_stops
    description: >
      One row per constructor per season with pit stop data (2011 onwards). Stops over 60 seconds
      are excluded from the count and median because they are red-flag stoppages.
    columns:
      - name: season
        description: Championship year.
        data_tests:
          - not_null
      - name: constructor_id
        description: Constructor that ran the pit crew for the stop.
        data_tests:
          - not_null
      - name: pit_stop_count
        description: Pit stops of 60 seconds or less.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: median_pit_stop_seconds
        description: Median stop duration in seconds, rounded to milliseconds.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 60
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - constructor_id

  - name: fct_qualifying
    description: >
      One row per qualifying entry, from 1994. best_time_ms is the fastest of Q1, Q2 and Q3.
      gap_to_pole_pct is the gap as a percentage of the pole time, so 0.512 means 0.512%.
    columns:
      - name: qualify_id
        description: Primary key from the source QUALIFYID.
        data_tests:
          - unique
          - not_null
      - name: race_id
        description: Grand Prix the qualifying session belongs to.
        data_tests:
          - not_null
      - name: season
        description: Championship year.
        data_tests:
          - not_null
      - name: driver_id
        description: Driver who qualified.
        data_tests:
          - not_null
      - name: constructor_id
        description: Constructor for this entry.
        data_tests:
          - not_null
      - name: qualifying_position
        description: Qualifying classification position.
        data_tests:
          - not_null
      - name: best_time_ms
        description: Fastest of Q1, Q2 and Q3 in milliseconds. Null when the driver set no time.
      - name: pole_time_ms
        description: Fastest best_time_ms in the same race (the pole time), ignoring nulls.
      - name: gap_to_pole_ms
        description: best_time_ms minus pole_time_ms. Null when the driver set no time.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                where: "gap_to_pole_ms is not null"
      - name: gap_to_pole_pct
        description: gap_to_pole_ms as a percentage of pole_time_ms. Null when the driver set no time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - race_id
              - driver_id

  - name: mart_teammate_head_to_head
    description: >
      One row per season, constructor, driver and teammate, for drivers who shared a constructor in
      the same Grand Prix at least once. Both orderings of each pair are present. Race position uses
      each driver's best position_order that race. Qualifying position uses the qualifying classification.
    columns:
      - name: season
        description: Championship year.
        data_tests:
          - not_null
      - name: constructor_id
        description: Constructor the pair shared.
        data_tests:
          - not_null
      - name: driver_id
        description: The driver the row is about.
        data_tests:
          - not_null
      - name: teammate_id
        description: The teammate being compared against.
        data_tests:
          - not_null
      - name: races_together
        description: Distinct Grands Prix in which both drivers had a result for this constructor.
        data_tests:
          - not_null
      - name: races_ahead
        description: Of races_together, the races where the driver's best position_order beat the teammate's.
        data_tests:
          - not_null
      - name: qualifying_together
        description: Distinct races in which both drivers had a qualifying entry for this constructor.
        data_tests:
          - not_null
      - name: qualifying_ahead
        description: Of qualifying_together, the races where the driver qualified ahead of the teammate.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - constructor_id
              - driver_id
              - teammate_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: "races_ahead <= races_together and qualifying_ahead <= qualifying_together and driver_id <> teammate_id"

  - name: fct_driver_race_pace
    description: >
      One row per driver per race that has lap data and at least one green-flag lap. Green-flag rules are
      in int_lap_green_flags. Lap data covers 1996 onwards, and pit exclusions cover 2011 onwards.
    columns:
      - name: race_id
        description: Grand Prix.
        data_tests:
          - not_null
      - name: driver_id
        description: Driver.
        data_tests:
          - not_null
      - name: green_laps
        description: Count of green-flag laps.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: median_green_lap_ms
        description: Median green-flag lap time in milliseconds. Can be a half millisecond when the lap count is even.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - race_id
              - driver_id

  - name: fct_lap_times
    description: >
      One row per driver per lap per race, from 1996. Incremental by race. Each run replaces
      every lap of the new races and of the two most recent races already loaded, so corrected
      lap times from the timing provider flow through without a full refresh. Older races are
      not reprocessed.
    columns:
      - name: race_id
        description: Grand Prix. Also the incremental unique key, so a whole race is replaced at once.
        data_tests:
          - not_null
      - name: season
        description: Championship year.
        data_tests:
          - not_null
      - name: round
        description: Round within the season.
        data_tests:
          - not_null
      - name: race_date
        description: Race date. Drives the incremental window.
        data_tests:
          - not_null
      - name: driver_id
        description: Driver who set the lap.
        data_tests:
          - not_null
      - name: lap
        description: Lap number, starting at 1.
        data_tests:
          - not_null
      - name: position
        description: Running race position at the end of the lap.
      - name: lap_time_ms
        description: Lap duration in milliseconds, from the MILLISECONDS source column.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - race_id
              - driver_id
              - lap

  - name: fct_stints
    description: >
      One row per driver per tyre stint, for races with pit stop data (2011 onwards). A pit stop on
      lap L ends the stint at L, and the next stint starts at L + 1. The last stint ends on the driver's
      last recorded lap. Stints with no laps are dropped. avg_lap_time_ms averages every lap in the stint,
      including laps that the green-flag rules would exclude. Incremental by race, with the same window as
      fct_lap_times, so a race's stints are rebuilt in full whenever the race is reprocessed.
    columns:
      - name: race_id
        description: Grand Prix. Also the incremental unique key.
        data_tests:
          - not_null
      - name: season
        description: Championship year.
        data_tests:
          - not_null
      - name: round
        description: Round within the season.
        data_tests:
          - not_null
      - name: race_date
        description: Race date. Drives the incremental window.
        data_tests:
          - not_null
      - name: driver_id
        description: Driver.
        data_tests:
          - not_null
      - name: stint_number
        description: Stint index for the driver in this race, starting at 1.
        data_tests:
          - not_null
      - name: start_lap
        description: First lap of the stint.
        data_tests:
          - not_null
      - name: end_lap
        description: Last lap of the stint. The pit lap for every stint except the last.
        data_tests:
          - not_null
      - name: stint_laps
        description: Number of laps recorded in the stint.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: avg_lap_time_ms
        description: Mean lap time over every lap in the stint, in milliseconds.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - race_id
              - driver_id
              - stint_number

  - name: fct_session_results
    description: >
      One row per result entry across Grand Prix and sprint sessions, from 1950 for races and 2021 for sprints.
      session_type is 'race' or 'sprint'. source_result_id is the RESULTID from the session's source table, and it
      is only unique within a session type, so (session_type, source_result_id) is the key. Race rows match fct_results.
    columns:
      - name: session_type
        description: '''race'' for Grand Prix, ''sprint'' for sprint.'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['race', 'sprint']
      - name: source_result_id
        description: RESULTID from the session's source table.
        data_tests:
          - not_null
      - name: finish_position
        description: Classified finishing place, null when not classified.
      - name: points
        description: Points for this session.
        data_tests:
          - not_null
      - name: is_win
        description: True when finish_position is 1.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - session_type
              - source_result_id

  - name: mart_driver_standings_by_round
    description: >
      One row per driver per round they appear in the official driver standings. The base for
      mart_driver_season_standings. championship_position is null when the official table leaves the driver unranked.
    columns:
      - name: season
        data_tests:
          - not_null
      - name: round
        data_tests:
          - not_null
      - name: race_id
        data_tests:
          - not_null
      - name: driver_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - race_id
              - driver_id

  - name: mart_alt_points_standings
    description: >
      What-if standings. One row per driver per season, for every driver with a Grand Prix result that season,
      scored under the points system named by the points_system var (default f1_current). Only classified finishers
      score, for position_order 1 to 10. Each result scores on its own. Sprints and fastest-lap points don't count.
      Ranking: alt_points descending, countback (wins, second places, through tenth), then lowest driver_id.
    columns:
      - name: points_system
        description: The system this run scored under.
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: driver_id
        data_tests:
          - not_null
      - name: alt_points
        description: Points under the selected system.
        data_tests:
          - not_null
      - name: alt_position
        description: Rank within the season, unique per season.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - driver_id
