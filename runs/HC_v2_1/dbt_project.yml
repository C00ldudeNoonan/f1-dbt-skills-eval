name: f1_analytics
version: "1.0.0"
config-version: 2

profile: f1

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

clean-targets:
  - target
  - dbt_packages

models:
  f1_analytics:
    +materialized: view
    +access: protected
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +materialized: table

vars:
  points_system: f1_current
  raw_database: ANALYTICS_DEV
  raw_schema: F1_RAW_HC_v2_1

on-run-start:
  - "{{ assert_raw_source_contract() }}"
