name: f1
version: '1.0.0'
config-version: 2
profile: f1

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  f1:
    # Layers: staging (1:1 cleaned views of raw) -> intermediate -> marts (published tables).
    # Marts build into the target schema itself (F1_DBT_SA_1); other layers get a suffix.
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
