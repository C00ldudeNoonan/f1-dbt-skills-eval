version: 2

seeds:
  - name: official_world_champions
    description: >
      Independent reference list of FIA Drivers' World Champions for every
      completed season, maintained by hand from the official record. Used only
      to test that mart_driver_season_standings reproduces real history.
      Add a row when a season finishes.
    config:
      column_types:
        season: integer
        driver_ref: varchar
    columns:
      - name: season
        description: Championship year.
        data_tests: [unique, not_null]
      - name: driver_ref
        description: Ergast driver reference of the champion.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ergast__drivers')
                field: driver_ref
