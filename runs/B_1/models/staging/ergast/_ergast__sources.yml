          - name: milliseconds
            data_type: text
      - name: pit_stops
        description: >
          One row per pit stop (2011 onwards). The vendor dropped the redundant text `duration` column in the 2026-10 migration; use `milliseconds`.
        data_tests:
          - declared_columns_exist:
              arguments: {source_name: ergast, table_name: pit_stops}
          - no_undeclared_columns:
