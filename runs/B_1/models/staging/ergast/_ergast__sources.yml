version: 2

# Contract with the data vendor. Every raw column is declared, with its type.
# The declared_columns_exist / no_undeclared_columns tests (tests/generic/
# source_schema_drift.sql) compare this list with the live tables on every
# build. If the vendor renames, drops, retypes or adds a column, the source
# test fails (or warns, for additions) before any model runs. When the vendor
# changes something, update this file and the matching staging model together.
#
# Primary-key unique tests here only *warn*: a repeated vendor load (exact
# duplicate rows) is removed by `select distinct` in staging, so the build stays
# correct and current, and the warning still makes it visible. Duplicate keys
# with conflicting values fail the staging unique tests and block the marts.

sources:
  - name: ergast
    description: >
      Raw Formula 1 data from the Ergast / Kaggle "Formula 1 World Championship"
      CSVs, loaded by the data vendor into Snowflake. Every column is TEXT and
      missing values are the literal string '\N'. Read-only: never write here.
    database: ANALYTICS_DEV
    schema: F1_RAW_B_1
    tables:
      - name: circuits
        description: >
          One row per circuit.
        data_tests:
          - declared_columns_exist:
              arguments: {source_name: ergast, table_name: circuits}
          - no_undeclared_columns:
              arguments: {source_name: ergast, table_name: circuits}
        columns:
          - name: circuitid
            data_type: text
            data_tests:
              - not_null
              # warn, not error: staging removes exact duplicate rows, and the
              # staging-level unique test (error) still blocks conflicting ones.
              - unique:
                  config:
                    severity: warn
          - name: circuitref
            data_type: text
          - name: name
            data_type: text
          - name: location
            data_type: text
          - name: country
            data_type: text
          - name: lat
            data_type: text
          - name: lng
            data_type: text
          - name: alt
            data_type: text
          - name: url
            data_type: text
      - name: constructor_results
        description: >
          Constructor points per race.
        data_tests:
          - declared_columns_exist:
              arguments: {source_name: ergast, table_name: constructor_results}
          - no_undeclared_columns:
              arguments: {source_name: ergast, table_name: constructor_results}
        columns:
          - name: constructorresultsid
            data_type: text
            data_tests:
              - not_null
              # warn, not error: staging removes exact duplicate rows, and the
              # staging-level unique test (error) still blocks conflicting ones.
              - unique:
                  config:
                    severity: warn
          - name: raceid
            data_type: text
          - name: constructorid
            data_type: text
          - name: points
            data_type: text
          - name: status
            data_type: text
      - name: constructor_standings
        description: >
          Constructors' championship standings after each race.
        data_tests:
          - declared_columns_exist:
              arguments: {source_name: ergast, table_name: constructor_standings}
          - no_undeclared_columns:
              arguments: {source_name: ergast, table_name: constructor_standings}
        columns:
          - name: constructorstandingsid
            data_type: text
            data_tests:
              - not_null
              # warn, not error: staging removes exact duplicate rows, and the
              # staging-level unique test (error) still blocks conflicting ones.
              - unique:
                  config:
                    severity: warn
          - name: raceid
            data_type: text
          - name: constructorid
            data_type: text
          - name: points
            data_type: text
          - name: position
            data_type: text
          - name: positiontext
            data_type: text
          - name: wins
            data_type: text
      - name: constructors
        description: >
          One row per constructor (team).
        data_tests:
          - declared_columns_exist:
              arguments: {source_name: ergast, table_name: constructors}
          - no_undeclared_columns:
              arguments: {source_name: ergast, table_name: constructors}
        columns:
          - name: constructorid
            data_type: text
            data_tests:
              - not_null
              # warn, not error: staging removes exact duplicate rows, and the
              # staging-level unique test (error) still blocks conflicting ones.
              - unique:
                  config:
                    severity: warn
          - name: constructorref
            data_type: text
          - name: name
            data_type: text
          - name: nationality
            data_type: text
          - name: url
            data_type: text
      - name: driver_standings
        description: >
          Drivers' championship standings after each race. These are the official standings: they already apply historical dropped-score rules and the 1997 exclusion of Michael Schumacher.
        data_tests:
          - declared_columns_exist:
              arguments: {source_name: ergast, table_name: driver_standings}
          - no_undeclared_columns:
              arguments: {source_name: ergast, table_name: driver_standings}
        columns:
