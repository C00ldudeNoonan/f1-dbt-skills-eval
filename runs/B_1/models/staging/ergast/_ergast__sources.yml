          - name: code
            data_type: text
          - name: forename
            data_type: text
          - name: surname
            data_type: text
          - name: dob
            data_type: text
          - name: nationality
            data_type: text
          - name: url
            data_type: text
      - name: lap_times
        description: >
          One row per driver per lap (1996 onwards).
        data_tests:
