            data_type: text
            data_tests:
              - not_null
              # warn, not error: staging removes exact duplicate rows, and the
              # staging-level unique test (error) still blocks conflicting ones.
              - unique:
                  config:
                    severity: warn
          - name: raceid
            data_type: text
          - name: driverid
            data_type: text
          - name: points
            data_type: text
          - name: position
            data_type: text
          - name: positiontext
            data_type: text
          - name: wins
            data_type: text
      - name: drivers
        description: >
          One row per driver. Holds current values only; history is in the snp_drivers snapshot.
        data_tests:
          - declared_columns_exist:
              arguments: {source_name: ergast, table_name: drivers}
          - no_undeclared_columns:
