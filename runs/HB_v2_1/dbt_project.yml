name: f1_analytics
version: '1.0.0'
config-version: 2

profile: f1

model-paths: ['models']
seed-paths: ['seeds']
test-paths: ['tests']
macro-paths: ['macros']
target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

vars:
  # Where the vendor's raw F1 tables live. Change these to point at a different copy.
  raw_database: ANALYTICS_DEV
  raw_schema: F1_RAW_HB_V2_1
  # Pit stops longer than this are red-flag stoppages. They are excluded from pit stop metrics.
  red_flag_pit_stop_ms: 60000
  # A lap slower than this multiple of the fastest lap set in that race is not a green-flag lap.
  slow_lap_multiplier: 1.3
  # Telemetry incremental runs re-read this many hours before the newest loaded sample, to absorb
  # out-of-order commits at the edge of a load.
  telemetry_lookback_hours: 48

seeds:
  f1_analytics:
    +schema: reference

snapshots:
  f1_analytics:
    +schema: snapshots

models:
  f1_analytics:
    +materialized: view
    # Only fct_results and dim_drivers are public. Everything else is protected to this project.
    +access: protected
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
      +materialized: table
