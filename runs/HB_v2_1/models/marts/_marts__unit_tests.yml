unit_tests:
  - name: fct_qualifying_best_time_is_fastest_session_and_gap_is_to_race_pole
    description: >
      best_time_ms is the fastest of Q1 to Q3 even when Q3 is missing. Gaps are
      measured to the fastest best time in the race. A driver with no time has null
      best and gap fields.
    model: fct_qualifying
    given:
      - input: ref('stg_f1__qualifying')
        rows:
          - {qualify_id: 1, race_id: 1, driver_id: 1, constructor_id: 1, position: 1, q1_ms: 80000, q2_ms: 79500, q3_ms: null}
          - {qualify_id: 2, race_id: 1, driver_id: 2, constructor_id: 2, position: 2, q1_ms: 80295, q2_ms: null, q3_ms: null}
          - {qualify_id: 3, race_id: 1, driver_id: 3, constructor_id: 3, position: 3, q1_ms: 85000, q2_ms: 84000, q3_ms: 81090}
          - {qualify_id: 4, race_id: 1, driver_id: 4, constructor_id: 4, position: 4, q1_ms: null, q2_ms: null, q3_ms: null}
      - input: ref('stg_f1__races')
        rows:
          - {race_id: 1, season: 2020}
    expect:
      rows:
        - {qualify_id: 1, best_time_ms: 79500, gap_to_pole_ms: 0, gap_to_pole_pct: 0}
        - {qualify_id: 2, best_time_ms: 80295, gap_to_pole_ms: 795, gap_to_pole_pct: 1.0}
        - {qualify_id: 3, best_time_ms: 81090, gap_to_pole_ms: 1590, gap_to_pole_pct: 2.0}
        - {qualify_id: 4, best_time_ms: null, gap_to_pole_ms: null, gap_to_pole_pct: null}

  - name: int_lap_flags_marks_lap_one_pit_laps_and_slow_laps_as_not_green
    description: >
      Lap 1, the pit lap, the lap after the stop and any lap over 130% of the race's
      fastest lap are excluded. Other laps count as green.
    model: int_lap_flags
    given:
      - input: ref('stg_f1__lap_times')
        rows:
          - {race_id: 1, driver_id: 1, lap_number: 1, lap_ms: 95000}
          - {race_id: 1, driver_id: 1, lap_number: 2, lap_ms: 90000}
          - {race_id: 1, driver_id: 1, lap_number: 3, lap_ms: 100000}
          - {race_id: 1, driver_id: 1, lap_number: 4, lap_ms: 110000}
          - {race_id: 1, driver_id: 1, lap_number: 5, lap_ms: 90000}
          - {race_id: 1, driver_id: 1, lap_number: 6, lap_ms: 200000}
      - input: ref('stg_f1__pit_stops')
        rows:
          - {race_id: 1, driver_id: 1, stop_number: 1, lap_number: 3, pit_stop_ms: 22000}
    expect:
      rows:
        - {race_id: 1, driver_id: 1, lap_number: 1, is_green_lap: false}
        - {race_id: 1, driver_id: 1, lap_number: 2, is_green_lap: true}
        - {race_id: 1, driver_id: 1, lap_number: 3, is_pit_lap: true, is_green_lap: false}
        - {race_id: 1, driver_id: 1, lap_number: 4, is_post_pit_lap: true, is_slow_lap: false, is_green_lap: false}
        - {race_id: 1, driver_id: 1, lap_number: 5, is_green_lap: true}
        - {race_id: 1, driver_id: 1, lap_number: 6, is_slow_lap: true, is_green_lap: false}
