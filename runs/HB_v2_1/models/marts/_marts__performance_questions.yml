unit_tests:
  - name: int_teammate_race_gaps_pairs_classified_teammates_only
    description: >
      A driver's gap is teammate finish minus driver finish, so the mirror row is negated. A
      driver who did not finish is excluded from pairs, and so is a teammate who did not finish.
    model: int_teammate_race_gaps
    given:
      - input: ref('fct_results')
        rows:
          - {season: 2000, race_id: 1, constructor_id: 1, driver_id: 10, finish_position: 3}
          - {season: 2000, race_id: 1, constructor_id: 1, driver_id: 11, finish_position: 5}
          - {season: 2000, race_id: 1, constructor_id: 1, driver_id: 12, finish_position: null}
      - input: ref('fct_qualifying')
        rows:
          - {season: 2000, race_id: 1, constructor_id: 1, driver_id: 10, position: 2}
          - {season: 2000, race_id: 1, constructor_id: 1, driver_id: 11, position: 4}
    expect:
      rows:
        - {season: 2000, race_id: 1, driver_id: 10, teammate_id: 11, race_gap: 2, quali_gap: 2}
        - {season: 2000, race_id: 1, driver_id: 11, teammate_id: 10, race_gap: -2, quali_gap: -2}

  - name: mart_driver_overperformance_ranks_only_drivers_with_enough_evidence
    description: >
      A driver needs at least 30 race pairs over at least 3 seasons to be ranked. Ranking is by
      the lower 95% bound, so a consistent +1 with 30 races outranks a noisy driver with 10 races.
    model: mart_driver_overperformance
    given:
      - input: ref('int_teammate_race_gaps')
        rows:
          - {season: 2000, race_id: 1, constructor_id: 1, driver_id: 10, teammate_id: 11, race_gap: 1, quali_gap: 1}
