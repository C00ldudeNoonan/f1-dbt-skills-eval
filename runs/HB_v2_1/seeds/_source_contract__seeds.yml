version: 2

seeds:
  - name: source_contract
    description: >
      Every table and column the project expects in the raw F1 schema, as of the 2026-10-21
      vendor migration. tests/assert_raw_matches_source_contract.sql compares it with the live
      schema and fails on any missing or unexpected table or column, so a vendor change shows
      up at build time, not as wrong numbers. Update this seed on purpose when the vendor
      changes its shape, after the staging models have been updated to match.
    columns:
      - name: table_name
        data_tests: [not_null]
      - name: column_name
        data_tests: [not_null]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [table_name, column_name]
