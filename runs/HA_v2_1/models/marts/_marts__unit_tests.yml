version: 2

unit_tests:
  - name: dim_drivers_v2_projects_names_and_keeps_placeholder
    description: Version 2 shows first_name and last_name. Placeholder rows stay, with null names.
    model: dim_drivers
    versions:
      include: [2]
    given:
      - input: ref('int_dim_drivers')
        rows:
          - {driver_id: 1, driver_ref: alonso, first_name: Fernando, last_name: Alonso, full_name: Fernando Alonso, nationality: Spanish, date_of_birth: '1981-07-29', current_number: 14, driver_code: ALO, is_placeholder: false, career_starts: 1, career_wins: 1, career_podiums: 1, career_sprint_wins: 1, world_championships: 0}
          - {driver_id: 999, driver_ref: unknown_999, first_name: null, last_name: null, full_name: null, nationality: null, date_of_birth: null, current_number: null, driver_code: null, is_placeholder: true, career_starts: 2, career_wins: 0, career_podiums: 1, career_sprint_wins: 0, world_championships: 0}
    expect:
      rows:
        - {driver_id: 1, driver_ref: alonso, first_name: Fernando, last_name: Alonso, nationality: Spanish, is_placeholder: false, career_starts: 1, career_wins: 1, world_championships: 0}
        - {driver_id: 999, driver_ref: unknown_999, first_name: null, last_name: null, nationality: null, is_placeholder: true, career_starts: 2, career_wins: 0, world_championships: 0}

  - name: dim_drivers_v1_keeps_full_name_and_placeholder
    description: Version 1 keeps full_name and still carries placeholder rows.
    model: dim_drivers
    versions:
      include: [1]
    given:
      - input: ref('int_dim_drivers')
        rows:
          - {driver_id: 1, driver_ref: alonso, first_name: Fernando, last_name: Alonso, full_name: Fernando Alonso, nationality: Spanish, date_of_birth: '1981-07-29', current_number: 14, driver_code: ALO, is_placeholder: false, career_starts: 1, career_wins: 1, career_podiums: 1, career_sprint_wins: 1, world_championships: 0}
          - {driver_id: 999, driver_ref: unknown_999, first_name: null, last_name: null, full_name: null, nationality: null, date_of_birth: null, current_number: null, driver_code: null, is_placeholder: true, career_starts: 2, career_wins: 0, career_podiums: 1, career_sprint_wins: 0, world_championships: 0}
    expect:
      rows:
        - {driver_id: 1, driver_ref: alonso, full_name: Fernando Alonso, is_placeholder: false, career_starts: 1, career_wins: 1}
        - {driver_id: 999, driver_ref: unknown_999, full_name: null, is_placeholder: true, career_starts: 2, career_wins: 0}

  - name: stints_boundaries_and_empty_stint_dropped
    description: >
      Driver 1 pits on laps 3 and 7 of 10 laps: stints 1-3, 4-7, 8-10. Driver 2 pits on the last
      lap (5 of 5): the stint after it has no laps and is dropped.
    model: fct_stints
    given:
      - input: ref('stg_f1__races')
        rows:
          - {race_id: 100, race_date: '2024-03-02'}
      - input: ref('stg_f1__pit_stops')
        rows:
          - {race_id: 100, driver_id: 1, lap: 3}
          - {race_id: 100, driver_id: 1, lap: 7}
          - {race_id: 100, driver_id: 2, lap: 5}
      - input: ref('stg_f1__lap_times')
        rows:
          - {race_id: 100, driver_id: 1, lap: 1, lap_time_ms: 1000}
          - {race_id: 100, driver_id: 1, lap: 2, lap_time_ms: 2000}
          - {race_id: 100, driver_id: 1, lap: 3, lap_time_ms: 3000}
          - {race_id: 100, driver_id: 1, lap: 4, lap_time_ms: 4000}
          - {race_id: 100, driver_id: 1, lap: 5, lap_time_ms: 5000}
          - {race_id: 100, driver_id: 1, lap: 6, lap_time_ms: 6000}
          - {race_id: 100, driver_id: 1, lap: 7, lap_time_ms: 7000}
          - {race_id: 100, driver_id: 1, lap: 8, lap_time_ms: 8000}
          - {race_id: 100, driver_id: 1, lap: 9, lap_time_ms: 9000}
          - {race_id: 100, driver_id: 1, lap: 10, lap_time_ms: 10000}
          - {race_id: 100, driver_id: 2, lap: 1, lap_time_ms: 1000}
          - {race_id: 100, driver_id: 2, lap: 2, lap_time_ms: 2000}
          - {race_id: 100, driver_id: 2, lap: 3, lap_time_ms: 3000}
          - {race_id: 100, driver_id: 2, lap: 4, lap_time_ms: 4000}
          - {race_id: 100, driver_id: 2, lap: 5, lap_time_ms: 5000}
    expect:
      rows:
        - {race_id: 100, driver_id: 1, stint_number: 1, start_lap: 1, end_lap: 3, stint_laps: 3, avg_lap_time_ms: 2000}
        - {race_id: 100, driver_id: 1, stint_number: 2, start_lap: 4, end_lap: 7, stint_laps: 4, avg_lap_time_ms: 5500}
        - {race_id: 100, driver_id: 1, stint_number: 3, start_lap: 8, end_lap: 10, stint_laps: 3, avg_lap_time_ms: 9000}
        - {race_id: 100, driver_id: 2, stint_number: 1, start_lap: 1, end_lap: 5, stint_laps: 5, avg_lap_time_ms: 3000}

  - name: alt_points_countback_and_tie_break
    description: >
      Four drivers on 35 points. Countback on wins, then 2nd, then 3rd places, then the
      lowest driver_id. Driver 2 has no win, so ranks behind driver 1. Drivers 3 and 4
      tie on every count, so driver_id decides.
    model: mart_alt_points_standings
    given:
      - input: ref('points_systems')
        rows:
          - {points_system: current_25_to_1, position: 1, points: 25}
          - {points_system: current_25_to_1, position: 2, points: 18}
          - {points_system: current_25_to_1, position: 3, points: 15}
          - {points_system: current_25_to_1, position: 4, points: 12}
          - {points_system: current_25_to_1, position: 5, points: 10}
          - {points_system: current_25_to_1, position: 6, points: 8}
          - {points_system: current_25_to_1, position: 7, points: 6}
          - {points_system: current_25_to_1, position: 8, points: 4}
          - {points_system: current_25_to_1, position: 9, points: 2}
          - {points_system: current_25_to_1, position: 10, points: 1}
      - input: ref('fct_results')
        rows:
          - {result_id: 1, season: 2024, driver_id: 1, position_order: 1, finish_position: 1}
          - {result_id: 2, season: 2024, driver_id: 1, position_order: 5, finish_position: 5}
          - {result_id: 3, season: 2024, driver_id: 2, position_order: 2, finish_position: 2}
          - {result_id: 4, season: 2024, driver_id: 2, position_order: 5, finish_position: 5}
          - {result_id: 5, season: 2024, driver_id: 2, position_order: 7, finish_position: 7}
          - {result_id: 6, season: 2024, driver_id: 2, position_order: 10, finish_position: 10}
          - {result_id: 7, season: 2024, driver_id: 3, position_order: 2, finish_position: 2}
          - {result_id: 8, season: 2024, driver_id: 3, position_order: 3, finish_position: 3}
          - {result_id: 9, season: 2024, driver_id: 3, position_order: 9, finish_position: 9}
          - {result_id: 10, season: 2024, driver_id: 4, position_order: 2, finish_position: 2}
          - {result_id: 11, season: 2024, driver_id: 4, position_order: 3, finish_position: 3}
          - {result_id: 12, season: 2024, driver_id: 4, position_order: 9, finish_position: 9}
    expect:
      rows:
        - {points_system: current_25_to_1, season: 2024, driver_id: 1, alt_points: 35, alt_position: 1}
        - {points_system: current_25_to_1, season: 2024, driver_id: 3, alt_points: 35, alt_position: 2}
        - {points_system: current_25_to_1, season: 2024, driver_id: 4, alt_points: 35, alt_position: 3}
        - {points_system: current_25_to_1, season: 2024, driver_id: 2, alt_points: 35, alt_position: 4}

  - name: driver_car_performance_interval_rule
    description: >
      Driver 1 beat teammates in 40 of 50 shared races (80%, lower bound above 50%) and is trusted.
      Driver 2 beat them in 12 of 40 (30%) and is not. Driver 3 has 20 shared races, below the minimum,
      so is not eligible even with a 100% record.
    model: mart_driver_car_performance
    given:
      - input: ref('mart_teammate_head_to_head')
        rows:
          - {season: 2016, constructor_id: 1, driver_id: 1, teammate_id: 2, races_together: 50, races_ahead: 40, qualifying_together: 50, qualifying_ahead: 30}
          - {season: 2016, constructor_id: 1, driver_id: 2, teammate_id: 1, races_together: 40, races_ahead: 12, qualifying_together: 40, qualifying_ahead: 10}
          - {season: 2016, constructor_id: 3, driver_id: 3, teammate_id: 4, races_together: 20, races_ahead: 20, qualifying_together: 20, qualifying_ahead: 20}
    expect:
      rows:
        - {driver_id: 1, shared_races: 50, races_ahead: 40, is_eligible: true, trusted_overperformer: true}
        - {driver_id: 2, shared_races: 40, races_ahead: 12, is_eligible: true, trusted_overperformer: false}
        - {driver_id: 3, shared_races: 20, races_ahead: 20, is_eligible: false, trusted_overperformer: false}
