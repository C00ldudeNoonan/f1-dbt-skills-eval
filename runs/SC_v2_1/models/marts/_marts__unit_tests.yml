version: 2

unit_tests:
  - name: fct_driver_race_pace_excludes_non_green_laps
    description: Lap 1, pit lap, lap after pit and laps over 130% of the race's fastest lap are dropped.
    model: fct_driver_race_pace
    given:
      - input: ref('stg_f1__lap_times')
        rows:
          # driver 1: lap 1 (excluded), lap 2 ok, lap 3 pit lap, lap 4 after pit, laps 5-6 ok, lap 7 too slow
          - {race_id: 1, driver_id: 1, lap: 1, lap_time_ms: 100000}
          - {race_id: 1, driver_id: 1, lap: 2, lap_time_ms: 90000}
          - {race_id: 1, driver_id: 1, lap: 3, lap_time_ms: 120000}
          - {race_id: 1, driver_id: 1, lap: 4, lap_time_ms: 95000}
          - {race_id: 1, driver_id: 1, lap: 5, lap_time_ms: 91000}
          - {race_id: 1, driver_id: 1, lap: 6, lap_time_ms: 117000}
          - {race_id: 1, driver_id: 1, lap: 7, lap_time_ms: 117001}
          # driver 2: only lap 1 -> no green laps -> no row
          - {race_id: 1, driver_id: 2, lap: 1, lap_time_ms: 90000}
      - input: ref('stg_f1__pit_stops')
        rows:
          - {race_id: 1, driver_id: 1, stop_number: 1, lap: 3, duration_ms: 22000}
    expect:
      rows:
        # fastest lap is 90000 -> cutoff 117000 inclusive; green laps = 2, 5, 6
        - {race_id: 1, driver_id: 1, green_laps: 3, median_green_lap_ms: 91000}

  - name: mart_constructor_season_pit_stops_drops_red_flag_stops
    model: mart_constructor_season_pit_stops
    given:
      - input: ref('stg_f1__pit_stops')
        rows:
          - {race_id: 1, driver_id: 1, stop_number: 1, lap: 10, duration_ms: 20000}
          - {race_id: 1, driver_id: 1, stop_number: 2, lap: 30, duration_ms: 24000}
          - {race_id: 1, driver_id: 1, stop_number: 3, lap: 40, duration_ms: 60000}
          - {race_id: 1, driver_id: 1, stop_number: 4, lap: 41, duration_ms: 60001}
      - input: ref('fct_results')
        rows:
          - {race_id: 1, driver_id: 1, constructor_id: 7, season: 2020}
    expect:
      rows:
        - {season: 2020, constructor_id: 7, pit_stop_count: 3, median_pit_stop_seconds: 24.0}

  - name: fct_stints_boundaries
    description: >
      A stop on lap L ends the stint on L and the next starts on L+1. Stint 1 starts on lap 1,
      the last stint ends on the last recorded lap, a stop on the last lap leaves no empty
      stint, and races without pit stop data produce no stints.
    model: fct_stints
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('fct_lap_times')
        rows:
          # driver 1 stops on laps 3 and 6 -> stints 1-3, 4-6, 7-8
          - {race_id: 1, season: 2024, round: 1, driver_id: 1, lap: 1, lap_time_ms: 100000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 1, lap: 2, lap_time_ms: 90000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 1, lap: 3, lap_time_ms: 120000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 1, lap: 4, lap_time_ms: 95000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 1, lap: 5, lap_time_ms: 91000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 1, lap: 6, lap_time_ms: 110000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 1, lap: 7, lap_time_ms: 92000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 1, lap: 8, lap_time_ms: 93000}
          # driver 2 stops on its last recorded lap (4) -> only stint 1-4
          - {race_id: 1, season: 2024, round: 1, driver_id: 2, lap: 1, lap_time_ms: 100000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 2, lap: 2, lap_time_ms: 100000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 2, lap: 3, lap_time_ms: 100000}
          - {race_id: 1, season: 2024, round: 1, driver_id: 2, lap: 4, lap_time_ms: 140000}
          # race 2 has laps but no pit stop data -> no stints
          - {race_id: 2, season: 2024, round: 2, driver_id: 1, lap: 1, lap_time_ms: 100000}
      - input: ref('stg_f1__pit_stops')
        rows:
          - {race_id: 1, driver_id: 1, stop_number: 1, lap: 3, duration_ms: 22000}
          - {race_id: 1, driver_id: 1, stop_number: 2, lap: 6, duration_ms: 23000}
          - {race_id: 1, driver_id: 2, stop_number: 1, lap: 4, duration_ms: 21000}
    expect:
      rows:
        - {race_id: 1, driver_id: 1, stint_number: 1, start_lap: 1, end_lap: 3, stint_laps: 3, avg_lap_time_ms: 103333.33333333333}
        - {race_id: 1, driver_id: 1, stint_number: 2, start_lap: 4, end_lap: 6, stint_laps: 3, avg_lap_time_ms: 98666.66666666667}
        - {race_id: 1, driver_id: 1, stint_number: 3, start_lap: 7, end_lap: 8, stint_laps: 2, avg_lap_time_ms: 92500}
        - {race_id: 1, driver_id: 2, stint_number: 1, start_lap: 1, end_lap: 4, stint_laps: 4, avg_lap_time_ms: 110000}

  - name: alt_points_countback_tie_breaks
    description: >
      Tied on points: more wins beats more seconds (driver 20 over 10); identical finishes fall to
      lowest driver_id (30 before 31). Unclassified finishes score nothing and a driver with no
      points is still ranked.
    model: mart_alt_points_standings
    given:
      - input: ref('fct_results')
        rows:
          # driver 10: two 2nd places = 10 points; driver 20: one win = 10 points (more wins ranks first)
          - {season: 2000, driver_id: 10, position_order: 2, finish_position: 2}
          - {season: 2000, driver_id: 10, position_order: 2, finish_position: 2}
          - {season: 2000, driver_id: 20, position_order: 1, finish_position: 1}
          # drivers 31 and 30: each one 3rd place -> tie on points and countback, lower id first
          - {season: 2000, driver_id: 31, position_order: 3, finish_position: 3}
          - {season: 2000, driver_id: 30, position_order: 3, finish_position: 3}
          # driver 40: a 1st-position_order entry that was not classified scores nothing
          - {season: 2000, driver_id: 40, position_order: 1, finish_position: null}
      - input: ref('ref_points_systems')
        rows:
          - {points_system: current_2010, position_order: 1, points: 10}
          - {points_system: current_2010, position_order: 2, points: 5}
          - {points_system: current_2010, position_order: 3, points: 2}
          - {points_system: 1991_2002, position_order: 1, points: 99}
    expect:
      rows:
        - {season: 2000, driver_id: 20, alt_points: 10, alt_position: 1}
        - {season: 2000, driver_id: 10, alt_points: 10, alt_position: 2}
        - {season: 2000, driver_id: 30, alt_points: 2, alt_position: 3}
        - {season: 2000, driver_id: 31, alt_points: 2, alt_position: 4}
        - {season: 2000, driver_id: 40, alt_points: 0, alt_position: 5}

  - name: lap_telemetry_summary_aggregates
    description: Full throttle is throttle >= 99 inclusive, as a percentage of the lap's samples.
    model: mart_lap_telemetry_summary
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('fct_telemetry')
        rows:
          - {race_id: 1, driver_id: 1, lap: 1, sample_index: 1, speed_kph: 100.0, throttle_pct: 100, brake: false, loaded_at: '2024-01-01 10:00:00'}
          - {race_id: 1, driver_id: 1, lap: 1, sample_index: 2, speed_kph: 250.5, throttle_pct: 99, brake: false, loaded_at: '2024-01-01 10:00:01'}
          - {race_id: 1, driver_id: 1, lap: 1, sample_index: 3, speed_kph: 150.0, throttle_pct: 98.9, brake: true, loaded_at: '2024-01-01 10:00:02'}
          - {race_id: 1, driver_id: 1, lap: 1, sample_index: 4, speed_kph: 90.0, throttle_pct: 0, brake: true, loaded_at: '2024-01-03 10:00:00'}
          - {race_id: 1, driver_id: 1, lap: 2, sample_index: 1, speed_kph: 200.0, throttle_pct: 50, brake: false, loaded_at: '2024-01-01 10:00:03'}
    expect:
      rows:
        - {race_id: 1, driver_id: 1, lap: 1, samples: 4, max_speed_kph: 250.5, avg_throttle_pct: 74.475, full_throttle_pct: 50.0, brake_samples: 2, last_loaded_at: '2024-01-03 10:00:00'}
        - {race_id: 1, driver_id: 1, lap: 2, samples: 1, max_speed_kph: 200.0, avg_throttle_pct: 50.0, full_throttle_pct: 0.0, brake_samples: 0, last_loaded_at: '2024-01-01 10:00:03'}
