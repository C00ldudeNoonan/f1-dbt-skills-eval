version: 2

unit_tests:
  - name: test_fastest_lap_time_parsing
    description: >
      fastestlaptime (m:ss.mmm, as text) becomes integer milliseconds; the \N marker and blanks are
      null; a lapped finisher with a blank position is classified from positiontext.
    model: stg_ergast__results
    given:
      - input: source('ergast', 'results')
        rows:
          - {resultid: '1', raceid: '1', driverid: '1', constructorid: '1', statusid: '1', grid: '1', position: '1', positiontext: '1', position_order: '1', points: '25', laps: '57', fastestlaptime: '1:27.452'}
          - {resultid: '2', raceid: '1', driverid: '2', constructorid: '1', statusid: '1', grid: '2', position: '2', positiontext: '2', position_order: '2', points: '18', laps: '57', fastestlaptime: '0:55.404'}
          - {resultid: '3', raceid: '1', driverid: '3', constructorid: '1', statusid: '1', grid: '3', position: '3', positiontext: '3', position_order: '3', points: '15', laps: '57', fastestlaptime: '10:02.007'}
          - {resultid: '4', raceid: '1', driverid: '4', constructorid: '1', statusid: '5', grid: '4', position: '\N', positiontext: 'R', position_order: '4', points: '0', laps: '3', fastestlaptime: '\N'}
          - {resultid: '5', raceid: '1', driverid: '5', constructorid: '1', statusid: '11', grid: '5', position: '\N', positiontext: '11', position_order: '5', points: '0', laps: '56', fastestlaptime: ''}
    expect:
      rows:
        - {result_id: 1, finish_position: 1, fastest_lap_time_ms: 87452}
        - {result_id: 2, finish_position: 2, fastest_lap_time_ms: 55404}
        - {result_id: 3, finish_position: 3, fastest_lap_time_ms: 602007}
        - {result_id: 4, finish_position: null, fastest_lap_time_ms: null}
        - {result_id: 5, finish_position: 11, fastest_lap_time_ms: null}
