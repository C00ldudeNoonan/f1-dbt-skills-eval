version: 2

sources:
  - name: ergast
    description: >
      Ergast / Kaggle Formula 1 CSVs, loaded as-is by the data vendor. Every column is text and
      nulls are the literal string `\N` (qualifying times may also be blank). Read-only: nothing in
      this project writes here.

      The tables and columns listed below are the contract this project was built against.
      `assert_source_contract` (run at the start of every dbt invocation) compares them with the
      warehouse and stops the run with a readable report when a table or column is renamed or
      dropped, and lists any new columns.
    database: ANALYTICS_DEV
    schema: F1_RAW_SA_v2_1
    tables:
      - name: circuits
        columns:
          - name: circuitid
          - name: circuitref
          - name: name
          - name: location
          - name: country
          - name: lat
          - name: lng
          - name: alt
          - name: url
      - name: constructors
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [constructorid]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: constructorid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: constructorref
          - name: name
          - name: nationality
          - name: url
      - name: constructor_results
        columns:
          - name: constructorresultsid
          - name: raceid
          - name: constructorid
          - name: points
          - name: status
      - name: constructor_standings
        columns:
          - name: constructorstandingsid
          - name: raceid
          - name: constructorid
          - name: points
          - name: position
          - name: positiontext
          - name: wins
      - name: drivers
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [driverid]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: driverid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: driverref
          - name: number
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
                    nullable: true
          - name: code
          - name: forename
          - name: surname
          - name: dob
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}'
          - name: nationality
          - name: url
      - name: driver_standings
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [raceid, driverid]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: driverstandingsid
          - name: raceid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: driverid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: points
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+([.][0-9]+)?'
          - name: position
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: positiontext
          - name: wins
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
      - name: lap_timing
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [raceid, driverid, lap]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: raceid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: driverid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: lap
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: position
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: time
          - name: milliseconds
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
      - name: pit_stops
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [raceid, driverid, stop]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: raceid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: driverid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: stop
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: lap
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: time
          - name: milliseconds
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
      - name: qualifying
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [raceid, driverid]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: qualifyid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: raceid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: driverid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: constructorid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: number
          - name: position
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: q1
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+:[0-9]{2}[.][0-9]{3}'
                    nullable: true
          - name: q2
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+:[0-9]{2}[.][0-9]{3}'
                    nullable: true
          - name: q3
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+:[0-9]{2}[.][0-9]{3}'
                    nullable: true
      - name: races
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [raceid]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: raceid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: year
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: round
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: circuitid
          - name: name
          - name: date
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]{2}/[0-9]{2}/[0-9]{4}'
          - name: time
          - name: url
          - name: fp1_date
          - name: fp1_time
          - name: fp2_date
          - name: fp2_time
          - name: fp3_date
          - name: fp3_time
          - name: quali_date
          - name: quali_time
          - name: sprint_date
          - name: sprint_time
      - name: results
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [resultid]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: resultid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: raceid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: driverid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: constructorid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: number
          - name: grid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: position
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
                    nullable: true
          - name: positiontext
          - name: position_order
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: points
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+([.][0-9]+)?'
          - name: laps
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
          - name: time
          - name: milliseconds
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
                    nullable: true
          - name: fastestlap
          - name: rank
          - name: fastestlaptime
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+:[0-9]{2}[.][0-9]{3}'
                    nullable: true
          - name: fastestlapspeed
          - name: statusid
            data_tests:
              - source_value_format:
                  arguments:
                    pattern: '[0-9]+'
      - name: seasons
        columns:
          - name: year
          - name: url
      - name: sprint_results
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [resultid]
              config:
                severity: warn  # raw duplicates are collapsed in staging; this makes the vendor's re-delivery visible
        columns:
          - name: resultid
            data_tests:
              - source_value_format:
