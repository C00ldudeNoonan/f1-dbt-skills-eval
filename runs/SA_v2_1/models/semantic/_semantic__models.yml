version: 2

models:
  - name: metricflow_time_spine
    description: One row per day from 1950-01-01 (~100 years). Required by the Semantic Layer.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        data_tests: [unique, not_null]


metrics:
  - name: podium_rate
    label: Podium rate
    description: Podiums divided by race starts.
    type: ratio
    numerator: podiums
    denominator: race_starts
  - name: points_per_start
    label: Points per start
    description: Championship points divided by race starts.
    type: ratio
    numerator: championship_points
    denominator: race_starts
