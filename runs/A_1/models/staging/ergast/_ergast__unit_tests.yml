version: 2

unit_tests:
  - name: test_fastest_lap_time_parsing
    description: >
      fastestLapTime text -> integer milliseconds (lap_time_to_ms macro, via
      stg_ergast__results). Covers M:SS.mmm, bare SS.mmm, laps over ten
      minutes, stray whitespace, the vendor's \N null marker, real nulls, and
      unparseable text.
    model: stg_ergast__results
    given:
      - input: source('ergast', 'results')
        rows:
          - {resultid: '1', fastestlaptime: '1:27.452'}
          - {resultid: '2', fastestlaptime: '59.123'}
          - {resultid: '3', fastestlaptime: '10:05.001'}
          - {resultid: '4', fastestlaptime: '1:05.2'}
          - {resultid: '5', fastestlaptime: '  1:27.452 '}
          - {resultid: '6', fastestlaptime: '\\N'}
          - {resultid: '7', fastestlaptime: null}
          - {resultid: '8', fastestlaptime: 'not a time'}
    expect:
      rows:
        - {result_id: 1, fastest_lap_time_ms: 87452}
        - {result_id: 2, fastest_lap_time_ms: 59123}
        - {result_id: 3, fastest_lap_time_ms: 605001}
        - {result_id: 4, fastest_lap_time_ms: 65200}
        - {result_id: 5, fastest_lap_time_ms: 87452}
        - {result_id: 6, fastest_lap_time_ms: null}
        - {result_id: 7, fastest_lap_time_ms: null}
        - {result_id: 8, fastest_lap_time_ms: null}

  - name: test_finish_position_null_when_not_classified
    description: finish_position comes from positionText and is null for non-numeric codes (R, D, W, ...), even when the raw position column is \N for a classified finisher.
    model: stg_ergast__results
    given:
      - input: source('ergast', 'results')
        rows:
          - {resultid: '1', position: '3', positiontext: '3'}
          - {resultid: '2', position: '\\N', positiontext: '11'}
          - {resultid: '3', position: '\\N', positiontext: 'R'}
          - {resultid: '4', position: '\\N', positiontext: 'D'}
    expect:
      rows:
        - {result_id: 1, finish_position: 3}
        - {result_id: 2, finish_position: 11}
        - {result_id: 3, finish_position: null}
        - {result_id: 4, finish_position: null}
