      - name: vb_drivers
        description: "Vendor B (cross-check feed, 2018 onwards). One row per Vendor B driver. FULL_NAME is 'SURNAME Forename' with the surname in capitals and no accents. RACING_NUMBER is not unique (numbers are reused across seasons)."
        data_tests:
          - source_columns_match:
              name: source_contract_vb_drivers_columns_present
              arguments:
                expected_columns: [driver_key, full_name, abbreviation, racing_number]
                mode: missing
          - source_columns_match:
              name: source_contract_vb_drivers_no_unexpected_columns
              arguments:
                expected_columns: [driver_key, full_name, abbreviation, racing_number]
                mode: unexpected
              config:
                severity: warn
          - unique_combination_of_columns:
              name: source_duplicates_vb_drivers
              arguments:
                combination_of_columns: [driver_key]
              config:
                severity: warn
          - duplicates_are_identical:
              name: source_conflicting_duplicates_vb_drivers
              arguments:
                key_columns: [driver_key]
        columns:
          - name: driver_key
            data_tests: [not_null]
          - name: full_name
            data_tests:
              - matches_format:
                  name: source_contract_vb_drivers_full_name_format
                  arguments:
                    format: vendor_b_full_name
          - name: abbreviation
            data_tests:
              - matches_format:
                  name: source_contract_vb_drivers_abbreviation_format
                  arguments:
                    format: driver_code
      - name: vb_sessions
        description: "Vendor B sessions: one row per Grand Prix ('Race') or sprint ('Sprint'). MEETING_NAME is the circuit location, not the Grand Prix name. DATE_START is the UTC start (YYYY-MM-DDTHH:MI:SSZ). For the 2021 sprints the time part is \\N."
        data_tests:
          - source_columns_match:
              name: source_contract_vb_sessions_columns_present
              arguments:
                expected_columns: [session_key, session_type, meeting_name, year, date_start]
                mode: missing
          - source_columns_match:
              name: source_contract_vb_sessions_no_unexpected_columns
              arguments:
                expected_columns: [session_key, session_type, meeting_name, year, date_start]
                mode: unexpected
              config:
                severity: warn
          - unique_combination_of_columns:
              name: source_duplicates_vb_sessions
              arguments:
                combination_of_columns: [session_key]
              config:
                severity: warn
          - duplicates_are_identical:
              name: source_conflicting_duplicates_vb_sessions
              arguments:
                key_columns: [session_key]
        columns:
          - name: session_key
            data_tests: [not_null]
          - name: session_type
            data_tests:
              - accepted_values:
                  name: source_contract_vb_sessions_session_type_values
                  arguments:
                    values: ['Race', 'Sprint']
          - name: date_start
            data_tests:
              - matches_format:
                  name: source_contract_vb_sessions_date_start_format
                  arguments:
                    format: vendor_b_timestamp
      - name: vb_results
        description: "Vendor B results: one row per driver per session. POSITION is the classified finishing position, or DNF / DSQ for unclassified entries."
        data_tests:
          - source_columns_match:
              name: source_contract_vb_results_columns_present
              arguments:
                expected_columns: [session_key, driver_key, team_name, grid_position, position, points]
                mode: missing
          - source_columns_match:
              name: source_contract_vb_results_no_unexpected_columns
              arguments:
                expected_columns: [session_key, driver_key, team_name, grid_position, position, points]
                mode: unexpected
              config:
                severity: warn
          - unique_combination_of_columns:
              name: source_duplicates_vb_results
              arguments:
                combination_of_columns: [session_key, driver_key]
              config:
                severity: warn
          - duplicates_are_identical:
              name: source_conflicting_duplicates_vb_results
              arguments:
                key_columns: [session_key, driver_key]
        columns:
          - name: session_key
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('f1_raw', 'vb_sessions')
                    field: session_key
          - name: driver_key
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('f1_raw', 'vb_drivers')
                    field: driver_key
          - name: position
            data_tests:
              - matches_format:
                  name: source_contract_vb_results_position_format
                  arguments:
                    format: vendor_b_position
          - name: points
            data_tests: [not_null]
