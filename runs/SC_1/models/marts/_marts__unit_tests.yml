unit_tests:
  - name: dim_drivers_v1_keeps_full_name
    model: dim_drivers
    versions:
      include: [1]
    given:
      - input: ref('int_f1__driver_profiles')
        rows:
          - {driver_id: 1, first_name: Lewis, last_name: Hamilton}
          - {driver_id: 2, first_name: null, last_name: Madonna}
    expect:
      rows:
        - {driver_id: 1, full_name: Lewis Hamilton}
        - {driver_id: 2, full_name: Madonna}

  - name: dim_drivers_v2_splits_name
    model: dim_drivers
    versions:
      include: [2]
    given:
      - input: ref('int_f1__driver_profiles')
        rows:
          - {driver_id: 1, first_name: Lewis, last_name: Hamilton}
    expect:
      rows:
        - {driver_id: 1, first_name: Lewis, last_name: Hamilton}
